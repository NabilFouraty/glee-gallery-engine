# Netlify deployment configuration
# Netlify runs `npm run build`; NITRO_PRESET makes the server build target
# Netlify Functions. The Netlify preset publishes static files to `dist`
# and emits the server handler into `.netlify/`.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"
